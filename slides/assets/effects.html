<!-- FX LAYER — injected by new-deck.py --fx <level>. Not present in calm decks.
     Levels: editorial < keynote < max. Everything here is opt-in, degrades to
     nothing without WebGL, and switches itself off for print, for the QA
     screenshots' sake stays deterministic, and for prefers-reduced-motion. -->
<style id="fx-style">
/* ---------- ambient canvases ---------- */
.fx-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-2;pointer-events:none}
/* on a light surface a full-strength shader turns into mud and eats contrast */
html[data-theme="default"] .fx-canvas,html[data-theme="light"] .fx-canvas{opacity:.3}
/* over-blend has to stay a veil — at full strength it eats the slide underneath */
.fx-canvas.over{z-index:1;mix-blend-mode:screen;opacity:.4}
html[data-theme="default"] .fx-canvas.over,
html[data-theme="light"] .fx-canvas.over{mix-blend-mode:multiply;opacity:.5}
/* ---------- kinetic headline (editorial+) ---------- */
/* the mask box has to include descender room or "Projects," loses its j-tail */
.kin{display:inline-block;overflow:hidden;vertical-align:bottom;
  padding-bottom:.14em;margin-bottom:-.14em}
.kin>i{display:inline-block;font-style:inherit;transform:translateY(105%);
  animation:kinUp .78s cubic-bezier(.16,.9,.2,1) both;animation-delay:var(--kd,0s)}
@keyframes kinUp{to{transform:none}}
/* ---------- slide transitions (keynote+) ---------- */
html[data-fx-trans="zoom"] .slide.is-active{animation:tZoomIn .62s var(--ease) both}
html[data-fx-trans="zoom"] .slide.is-leaving{animation:tZoomOut .42s var(--ease) both}
@keyframes tZoomIn{from{opacity:0;transform:scale(1.07)}to{opacity:1;transform:none}}
@keyframes tZoomOut{to{opacity:0;transform:scale(.94)}}
html[data-fx-trans="push"] .slide.is-active{animation:tPushIn .6s var(--ease) both}
html[data-fx-trans="push"] .slide.is-leaving{animation:tPushOut .5s var(--ease) both}
@keyframes tPushIn{from{opacity:.4;transform:translateX(46px)}to{opacity:1;transform:none}}
@keyframes tPushOut{to{opacity:0;transform:translateX(-38px)}}
html[data-fx-trans="dip"] .slide.is-active{animation:tDip .7s var(--ease) both}
@keyframes tDip{0%{opacity:0;filter:brightness(.2)}45%{filter:brightness(.55)}100%{opacity:1;filter:none}}
.slide.is-leaving{display:flex!important;z-index:0}
.slide.is-active{z-index:1}
/* ---------- ken burns on imagery (editorial+) ---------- */
html[data-fx-kb="1"] .slide.is-active .imgframe img,
html[data-fx-kb="1"] .slide.is-active .bleed img{
  animation:kburns 22s ease-in-out both;transform-origin:var(--kb-origin,60% 40%)}
@keyframes kburns{from{transform:scale(1)}to{transform:scale(1.09)}}
/* ---------- headline treatments (data-fx-text on the h1/h2) ---------- */
.fx-particle-host:not(.slide){position:relative}
.fx-particle-host canvas.fx-text{position:absolute;left:0;top:0;pointer-events:none}
.fx-text-hidden{color:transparent!important}
.fx-mask{background:linear-gradient(100deg,var(--accent) 0%,var(--accent-2) 38%,
  var(--s3) 62%,var(--accent) 100%);background-size:280% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent!important;
  animation:maskflow 9s linear infinite}
@keyframes maskflow{to{background-position:280% 0}}
.el{display:inline-block;transform-origin:50% 100%}
.slide.is-active .el{animation:elastic .9s cubic-bezier(.2,1.5,.35,1) both;
  animation-delay:calc(var(--ed,0)*32ms + 120ms)}
@keyframes elastic{0%{opacity:0;transform:translateY(26px) scaleY(1.7) scaleX(.86)}
  60%{opacity:1;transform:translateY(0) scaleY(.9) scaleX(1.05)}100%{transform:none;opacity:1}}
/* ---------- glass panels (over art or a shader) ---------- */
.card.glass{background:color-mix(in srgb,var(--panel) 42%,transparent);
  backdrop-filter:blur(16px) saturate(1.7);-webkit-backdrop-filter:blur(16px) saturate(1.7);
  border:1px solid color-mix(in srgb,var(--ink) 12%,transparent);
  box-shadow:0 24px 60px -20px rgba(0,0,0,.35),inset 0 1px 0 color-mix(in srgb,#fff 45%,transparent)}
/* ---------- extra transitions ---------- */
html[data-fx-trans="dive"] .slide.is-active{animation:tDiveIn .72s cubic-bezier(.2,.8,.2,1) both}
html[data-fx-trans="dive"] .slide.is-leaving{animation:tDiveOut .55s cubic-bezier(.6,0,.9,.4) both}
@keyframes tDiveIn{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:none}}
@keyframes tDiveOut{to{opacity:0;transform:scale(2.4);filter:blur(6px)}}
html[data-fx-trans="tear"] .slide.is-active{animation:tTear .78s cubic-bezier(.3,.9,.2,1) both}
@keyframes tTear{from{clip-path:polygon(0 0,14% 0,4% 100%,0 100%);opacity:.85}
  to{clip-path:polygon(0 0,100% 0,100% 100%,0 100%);opacity:1}}
/* ---------- glow / spotlight accents (max) ---------- */
.fx-spot{position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(60% 55% at var(--sx,70%) var(--sy,42%),
    color-mix(in srgb,var(--accent) 26%,transparent),transparent 70%)}
@media (prefers-reduced-motion:reduce){
  .kin>i{animation:none!important;transform:none!important}
  .fx-canvas{display:none}
  html[data-fx-kb="1"] .slide.is-active img{animation:none!important}
}
/* PRINT: kill every effect canvas AND undo .fx-text-hidden. Without that second
   rule a particle headline printed mid-assembly gives a transparent headline over a
   scatter of dots — the canvas is hidden but the real type is still color:transparent,
   so the slide silently loses its title in every PDF and rasterised image. */
@media print{.fx-canvas,.fx-spot,canvas.fx-text{display:none!important}
    .fx-text-hidden{color:inherit!important}
    .kin>i{animation:none!important;transform:none!important}}
</style>
<script id="fx-script">
/* ============================================================ FX RUNTIME
   Mounted per slide from data-fx="…". Costs nothing on slides that don't ask.
     data-fx="ember"    rising heat + smoke      (WebGL, dark themes)
     data-fx="aurora"   slow flowing light bands (WebGL)
     data-fx="mesh"     soft drifting colour mesh(WebGL, works on light)
     data-fx="motes"    drifting particles       (2D canvas, cheap)
     data-fx="pixels"   shimmering pixel grid    (2D canvas, cheap; safe behind a
                                                  big number — low alpha by design)
     data-fx="spot"     static radial spotlight  (CSS only)
   Add data-fx-over to blend the canvas OVER the content instead of behind. */
(function(){
  const css=(n,el)=>getComputedStyle(el||document.documentElement).getPropertyValue(n).trim();
  const hex2rgb=h=>{h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');
    return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16)/255)};
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;

  const VERT='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
  const FRAG=`precision highp float;
uniform vec2 R;uniform float T;uniform int M;uniform vec3 A,B,C;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<6;i++){v+=a*n(p);p*=2.03;a*=.5;}return v;}
void main(){
  vec2 uv=gl_FragCoord.xy/R.xy; vec2 q=uv; float t=T*.06; float m;
  if(M==0){                                   /* ember: heat rising */
    q.y-=t*2.2; q.x+=sin(uv.y*3.+T*.15)*.06;
    m=fbm(q*vec2(3.,2.)+fbm(q*5.)*.5);
    m*=pow(1.-uv.y,1.5)*1.9; m=smoothstep(.18,1.05,m);
  }else if(M==1){                             /* aurora: flowing bands */
    q.x+=t*.5; float b=fbm(vec2(q.x*2.2,q.y*1.1+t));
    m=smoothstep(.35,.95,1.-abs(uv.y-.45-b*.35)*3.2);
  }else{                                      /* mesh: drifting blobs */
    vec2 a=vec2(fbm(q*1.6+t),fbm(q*1.6+t+3.1));
    m=fbm(q*2.1+a*1.4); m=smoothstep(.25,.9,m);
  }
  vec3 col=mix(A,B,clamp(m,0.,1.)); col=mix(col,C,clamp(m*m*1.15,0.,1.));
  gl_FragColor=vec4(col,clamp(m*1.05,0.,1.));
}`;
  function shader(host,mode){
    const c=document.createElement('canvas');
    c.className='fx-canvas'+(host.hasAttribute('data-fx-over')?' over':'');
    host.prepend(c);
    const gl=c.getContext('webgl',{alpha:true,antialias:false,premultipliedAlpha:false});
    if(!gl){ c.remove(); host.classList.add('fx-fallback');       // no WebGL: CSS glow instead
      const d=document.createElement('div'); d.className='fx-spot'; host.prepend(d); return }
    const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o};
    const pr=gl.createProgram();
    gl.attachShader(pr,sh(gl.VERTEX_SHADER,VERT)); gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FRAG));
    gl.linkProgram(pr); gl.useProgram(pr);
    const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
    const p=gl.getAttribLocation(pr,'p'); gl.enableVertexAttribArray(p);
    gl.vertexAttribPointer(p,2,gl.FLOAT,false,0,0);
    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
    const U=n=>gl.getUniformLocation(pr,n);
    const third=mode===0?'#ffd9a0':mode===1?css('--s3'):css('--accent-2');
    const pal=[css('--accent'),css('--accent-2'),third].map(hex2rgb);
    gl.uniform3fv(U('A'),pal[0]); gl.uniform3fv(U('B'),pal[1]); gl.uniform3fv(U('C'),pal[2]);
    gl.uniform1i(U('M'),mode);
    const size=()=>{const r=host.getBoundingClientRect();
      c.width=Math.max(2,r.width|0); c.height=Math.max(2,r.height|0);
      gl.viewport(0,0,c.width,c.height); gl.uniform2f(U('R'),c.width,c.height)};
    size(); addEventListener('resize',size);
    let t0=performance.now(), raf;
    (function loop(){
      const t=reduce?6:(performance.now()-t0)/1000;   // reduced motion: one frozen frame
      gl.uniform1f(U('T'),t); gl.drawArrays(gl.TRIANGLES,0,3);
      if(!reduce) raf=requestAnimationFrame(loop);
    })();
    host._fxStop=()=>cancelAnimationFrame(raf);
  }
  /* pixels — a grid of small squares lit by a slow diagonal wave, each cell given
     a random phase so it reads as shimmer rather than a marching pattern. 2D canvas,
     as cheap as motes. Deliberately low alpha: this is the one animated background
     that is safe behind a big number, which is what it was built for. */
  function pixels(host){
    const c=document.createElement('canvas'); c.className='fx-canvas'; host.prepend(c);
    const x=c.getContext('2d'); const r=host.getBoundingClientRect();
    c.width=r.width|0; c.height=r.height|0;
    const dark=document.documentElement.dataset.theme==='dark';
    const col=css('--accent');
    const S=20, GAP=5;
    const cols=Math.ceil(c.width/S)+1, rows=Math.ceil(c.height/S)+1;
    const ph=new Float32Array(cols*rows);
    for(let i=0;i<ph.length;i++) ph[i]=Math.random()*Math.PI*2;
    let t=0, raf;
    (function loop(){
      x.clearRect(0,0,c.width,c.height);
      x.fillStyle=col;
      for(let gy=0;gy<rows;gy++){
        for(let gx=0;gx<cols;gx++){
          const w=Math.sin(t+(gx+gy)*0.22+ph[gy*cols+gx]);
          if(w<=0) continue;
          const a=w*w*w;                       /* sharp peaks, mostly unlit */
          if(a<0.02) continue;
          x.globalAlpha=a*(dark?0.34:0.18);
          x.fillRect(gx*S, gy*S, S-GAP, S-GAP);
        }
      }
      if(!reduce){ t+=0.014; raf=requestAnimationFrame(loop) }
    })();
    host._fxStop=()=>cancelAnimationFrame(raf);
  }
  function motes(host){
    const c=document.createElement('canvas'); c.className='fx-canvas'; host.prepend(c);
    const x=c.getContext('2d'); const r=host.getBoundingClientRect();
    c.width=r.width|0; c.height=r.height|0;
    const dark=['dark'].includes(document.documentElement.dataset.theme);
    const col=css('--accent');
    const P=Array.from({length:70},()=>({x:Math.random()*c.width,y:Math.random()*c.height,
      r:Math.random()*2.4+.6,s:Math.random()*.28+.06,o:Math.random()*.5+.15}));
    let raf;
    (function loop(){
      x.clearRect(0,0,c.width,c.height);
      for(const q of P){
        if(!reduce){ q.y-=q.s; q.x+=Math.sin(q.y/70)*.22; if(q.y<-6){q.y=c.height+6;q.x=Math.random()*c.width} }
        x.globalAlpha=q.o*(dark?1:.55); x.fillStyle=col;
        x.beginPath(); x.arc(q.x,q.y,q.r,0,7); x.fill();
      }
      if(!reduce) raf=requestAnimationFrame(loop);
    })();
    host._fxStop=()=>cancelAnimationFrame(raf);
  }
  /* ---- headline treatments (data-fx-text="particles|mask|elastic") ----
     particles: the headline assembles out of ~2k motes, then hands off to the
     real type so it stays crisp (and screenshots/PDF get real text, not canvas). */
  function particleText(el){
    if(el.dataset.pt)return; el.dataset.pt='1';
    if(reduce)return;   /* leave the real crisp type alone — never hide it and then
                           depend on an animation nobody is going to see finish */
    const r=el.getBoundingClientRect(); if(!r.width||!r.height)return;
    const host=el.parentElement;
    if(getComputedStyle(host).position==='static')host.classList.add('fx-particle-host');
    const dpr=1, W=Math.ceil(r.width), H=Math.ceil(r.height);
    const off=document.createElement('canvas'); off.width=W; off.height=H;
    const oc=off.getContext('2d');
    const cs=getComputedStyle(el);
    oc.font=`${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    oc.textBaseline='top'; oc.fillStyle='#fff';
    // wrap the text the same way the element does, line by line
    const words=(el.textContent||'').trim().split(/\s+/); const lh=parseFloat(cs.lineHeight)||parseFloat(cs.fontSize)*1.1;
    let line='', y=0;
    for(const w of words){
      const t=line?line+' '+w:w;
      if(oc.measureText(t).width>W && line){ oc.fillText(line,0,y); y+=lh; line=w }
      else line=t;
    }
    if(line)oc.fillText(line,0,y);
    const data=oc.getImageData(0,0,W,H).data;
    const pts=[]; const step=Math.max(2,Math.round(Math.sqrt(W*H/2600)));
    for(let py=0;py<H;py+=step)for(let px=0;px<W;px+=step)
      if(data[(py*W+px)*4+3]>128)pts.push([px,py]);
    if(!pts.length)return;
    const c=document.createElement('canvas'); c.className='fx-text';
    c.width=W*dpr; c.height=H*dpr; c.style.width=W+'px'; c.style.height=H+'px';
    c.style.left=(el.offsetLeft)+'px'; c.style.top=(el.offsetTop)+'px';
    host.appendChild(c);
    const x=c.getContext('2d'); const col=cs.color;
    el.classList.add('fx-text-hidden');
    const P=pts.map(([hx,hy])=>({hx,hy,
      x:hx+(Math.random()-.5)*W*.9, y:hy+(Math.random()-.5)*H*4,
      d:Math.random()*.25}));
    const DUR=900, t0=performance.now();
    (function loop(now){
      const t=Math.min(1,(now-t0)/DUR);
      x.clearRect(0,0,W,H); x.fillStyle=col;
      for(const p of P){
        const e=Math.max(0,Math.min(1,(t-p.d)/(1-p.d)));
        const k=1-Math.pow(1-e,3);
        x.globalAlpha=k;
        x.fillRect(p.x+(p.hx-p.x)*k, p.y+(p.hy-p.y)*k, step*.8, step*.8);
      }
      if(t<1)requestAnimationFrame(loop);
      else{ el.classList.remove('fx-text-hidden');       // hand off to real type
            c.style.transition='opacity .25s'; c.style.opacity='0';
            setTimeout(()=>c.remove(),300) }
    })(t0);
  }
  function elasticText(el){
    if(el.dataset.el)return; el.dataset.el='1';
    const words=(el.textContent||'').trim().split(/\s+/); el.textContent='';
    let n=0;
    words.forEach((w,wi)=>{
      [...w].forEach(ch=>{
        const s=document.createElement('span'); s.className='el';
        s.style.setProperty('--ed',n++); s.textContent=ch; el.append(s);
      });
      if(wi<words.length-1)el.append(document.createTextNode(' '));
    });
  }
  /* animated film grain over the whole stage — cheaper and better looking than a
     static SVG turbulence, and it never lands in the PDF */
  function grain(stage){
    if(stage._grain)return; stage._grain=1;
    const c=document.createElement('canvas'); c.width=480; c.height=270;
    c.style.cssText='position:absolute;inset:0;width:100%;height:100%;z-index:3;'+
      'pointer-events:none;mix-blend-mode:overlay;opacity:.05';
    c.className='fx-canvas fx-grain-canvas'; stage.appendChild(c);
    const x=c.getContext('2d'), img=x.createImageData(c.width,c.height);
    (function loop(){
      const d=img.data;
      for(let i=0;i<d.length;i+=4){const v=(Math.random()*255)|0;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255}
      x.putImageData(img,0,0);
      if(!reduce)setTimeout(()=>requestAnimationFrame(loop),1000/24);  // 24fps, filmic
    })();
  }
  /* split a headline into word spans so it can rise in, word by word */
  function kinetic(el){
    if(el.dataset.kin)return; el.dataset.kin='1';
    const words=(el.textContent||'').trim().split(/\s+/);
    el.textContent='';
    words.forEach((w,i)=>{
      const s=document.createElement('span'); s.className='kin';
      const inner=document.createElement('i'); inner.textContent=w;
      inner.style.setProperty('--kd',(i*0.055+0.1)+'s');
      s.append(inner); el.append(s);
      if(i<words.length-1)el.append(document.createTextNode(' '));
    });
  }
  /* mount / unmount per slide, driven by the engine's slide change */
  window.fxEnter=function(slide){
    const kind=slide.dataset.fx;
    if(kind&&!slide.querySelector('.fx-canvas,.fx-spot')){
      if(kind==='ember')shader(slide,0);
      else if(kind==='aurora')shader(slide,1);
      else if(kind==='mesh')shader(slide,2);
      else if(kind==='motes')motes(slide);
      else if(kind==='pixels')pixels(slide);
      else if(kind==='spot'){const d=document.createElement('div');d.className='fx-spot';slide.prepend(d)}
    }
    /* per-headline treatments win over the default kinetic rise */
    const treated=new Set();
    slide.querySelectorAll('[data-fx-text]').forEach(el=>{
      treated.add(el);
      const k=el.dataset.fxText;
      if(k==='particles')particleText(el);
      else if(k==='elastic')elasticText(el);
      else if(k==='mask')el.classList.add('fx-mask');
    });
    if(document.documentElement.dataset.fxKinetic==='1')
      slide.querySelectorAll('.display,h1').forEach(el=>{if(!treated.has(el))kinetic(el)});
    if(document.documentElement.dataset.fxGrain==='1')grain(document.getElementById('stage'));
  };
  window.fxLeave=function(slide){ if(slide&&slide._fxStop)slide._fxStop(), slide._fxStop=null; };
})();
</script>
